<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真心话大冒险</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 模式选择弹窗 -->
    <div class="mode-modal" id="modeModal">
        <div class="mode-box">
            <h2>请选择游戏版本</h2>
            <button class="btn-mode" onclick="selectMode('normal')">🍃 普通版 (单人模式)</button>
            <button class="btn-mode btn-spicy" onclick="selectMode('advanced')">🔥 进阶版 (男女PK模式)</button>
        </div>
    </div>

    <div class="main-container">
        <!-- 左上角返回按钮 -->
        <button class="btn-back" onclick="resetGame()">↩ 重新选择</button>

        <h1>真心话大冒险</h1>
        
        <!-- 掷骰子与 PK 提示区域 -->
        <div class="dice-section">
            <div class="gender-indicator" id="genderIndicator">
                <span id="genderIcon">👦</span> <span id="genderText">请男方先掷骰子</span>
            </div>
            
            <div class="dice" id="dice">?</div>
            
            <!-- 比大小点数记录面板（仅在进阶模式显示） -->
            <div class="score-board" id="scoreBoard" style="display: none;">
                <span>👦 男方: <strong id="maleScore">-</strong></span>
                <span>👧 女方: <strong id="femaleScore">-</strong></span>
            </div>

            <button class="btn-dice" id="btnRoll" onclick="rollDice()">🎲 掷骰子</button>
        </div>

        <hr class="divider">

        <!-- 3D 抽卡卡片 -->
        <div class="card-container" id="cardContainer">
            <div class="card-inner">
                <div class="card-face card-front" id="cardFrontText">输了？选一项惩罚抽卡！</div>
                <div class="card-face card-back" id="result-box">准备好了吗？</div>
            </div>
        </div>

        <!-- 抽卡按钮 -->
        <div class="button-group">
            <button id="btnTruth" onclick="getQuestion('truth')">真心话</button>
            <button id="btnDare" onclick="getQuestion('dare')" class="btn-dare">大冒险</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
